name: Build data and deploy site

# Market data is generated here and shipped inside the Pages artifact, so it never
# bloats git history. docs/data is cached between runs (NBP rates are fetched
# incrementally and a failed ticker keeps yesterday's data).
on:
  schedule:
    - cron: "30 16 * * 1-5"   # after European close (UTC)
    - cron: "30 21 * * 1-5"   # after US close
    - cron: "0 6 * * 0"       # weekly refresh of fundamentals / events
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: docs/data
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Generate data
        run: python backend/generate.py

      - name: Save data cache
        uses: actions/cache/save@v4
        with:
          path: docs/data
          key: market-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
