name: Update market data

on:
  schedule:
    # weekdays after European close and again after US close (UTC)
    - cron: "30 16 * * 1-5"
    - cron: "30 21 * * 1-5"
    # weekly refresh of fundamentals/events
    - cron: "0 6 * * 0"
  push:
    branches: [main]
    paths: [tickers.json, config.json, backend/**]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Generate data
        run: python backend/generate.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update market data [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
