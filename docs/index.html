<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Portfolio</title>
<meta name="description" content="Free, private portfolio tracker: performance, dividends, allocation, events calendar and PIT-38 tax estimate.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b82f6'/><path d='M7 22l6-7 5 4 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="css/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="logo">↗</span> Investor<span class="brand-sub">Portfolio</span></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="dataStamp" class="muted small"></div>
      <div id="syncStamp" class="muted small"></div>
      <a data-repo-link="" target="_blank" rel="noopener" class="muted small">Source on GitHub</a>
    </div>
  </aside>
  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu" id="menuBtn" aria-label="Menu">☰</button>
      <select id="pfSelect" aria-label="Portfolio"></select>
      <div class="grow"></div>
      <label class="muted small ccy">Currency <select id="ccySelect" aria-label="Base currency"></select></label>
      <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">☾</button>
    </header>
    <main id="main"></main>
  </div>
</div>
<script type="module">
  // Wait for the deferred chart/calendar libraries before booting the app.
  window.addEventListener('DOMContentLoaded', () => import('./js/app.js'));
</script>
</body>
</html>
