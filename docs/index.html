<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investor Calendar</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #222; }
  .app { display: flex; height: 100vh; }
  .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
  .main { flex: 1; padding: 20px; min-width: 0; }
  h1 { font-size: 1.2rem; margin-bottom: 4px; }
  .subtitle { font-size: 0.75rem; color: #888; margin-bottom: 16px; }
  h2 { font-size: 0.8rem; text-transform: uppercase; color: #666; margin: 16px 0 8px; letter-spacing: 0.5px; }
  .ticker-list { list-style: none; margin: 0; }
  .ticker-list li { display: flex; justify-content: space-between; align-items: center; padding: 5px 8px; border-radius: 4px; font-size: 0.85rem; font-family: monospace; }
  .ticker-list li:nth-child(even) { background: #f9f9f9; }
  .ticker-list li .market-tag { font-size: 0.65rem; color: #888; font-family: sans-serif; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 0.75rem; margin-bottom: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .legend-dot.earnings { background: #2563eb; }
  .legend-dot.dividend { background: #16a34a; }
  .legend-dot.split { background: #ea580c; }
  .actions { margin-top: auto; padding-top: 16px; border-top: 1px solid #eee; display: flex; flex-direction: column; gap: 6px; }
  .actions a { display: block; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; text-align: center; }
  .actions .btn-primary { background: #0052cc; color: #fff; }
  .actions .btn-primary:hover { background: #003d99; }
  .actions .btn-secondary { background: #f0f0f0; color: #333; border: 1px solid #ddd; }
  .actions .btn-secondary:hover { background: #e5e5e5; }
  .status-bar { font-size: 0.7rem; color: #888; padding: 6px 0; }
  #calendar { background: #fff; border-radius: 8px; padding: 12px; }
  #calendar-container { height: calc(100vh - 40px); }
  #calendar-container .fc { height: 100%; }
  .fc-event.earnings { background: #2563eb; border-color: #2563eb; }
  .fc-event.dividend { background: #16a34a; border-color: #16a34a; }
  .fc-event.split { background: #ea580c; border-color: #ea580c; }
  .fc-daygrid-event { font-size: 0.7rem; padding: 1px 4px; border-radius: 3px; cursor: pointer; white-space: nowrap; }
  .fc-daygrid-event .fc-event-title { font-weight: 500; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>Investor Calendar</h1>
    <div class="subtitle" id="subtitle">Loading...</div>

    <div class="legend">
      <span class="legend-item"><span class="legend-dot earnings"></span> Earnings</span>
      <span class="legend-item"><span class="legend-dot dividend"></span> Dividends</span>
      <span class="legend-item"><span class="legend-dot split"></span> Splits</span>
    </div>

    <h2>Tracked Tickers</h2>
    <ul class="ticker-list" id="tickerList"><li style="color:#888;font-family:sans-serif">Loading...</li></ul>

    <div class="status-bar" id="statusBar"></div>

    <div class="actions">
      <a class="btn-primary" href="https://github.com/blitq/InvestorCalendar/edit/main/tickers.json" target="_blank">✏️ Edit tickers on GitHub</a>
      <a class="btn-secondary" href="https://github.com/blitq/InvestorCalendar/actions/workflows/update-data.yml" target="_blank">⟳ Trigger data refresh</a>
    </div>
  </div>

  <div class="main">
    <div id="calendar-container"><div id="calendar"></div></div>
  </div>
</div>

<script>
const EVENTS_URL = 'events.json';

let calendar;

async function load() {
  try {
    const resp = await fetch(EVENTS_URL + '?t=' + Date.now());
    const data = await resp.json();
    const events = data.events || [];
    const generated = data.generated_at || '';

    // build ticker list from events
    const tickerMap = {};
    for (const e of events) {
      if (!tickerMap[e.ticker]) tickerMap[e.ticker] = e.market || '';
    }
    const tickers = Object.entries(tickerMap).sort((a, b) => a[0].localeCompare(b[0]));

    renderTickers(tickers);
    renderCalendar(events);

    const dateStr = generated ? new Date(generated).toLocaleString() : 'today';
    document.getElementById('subtitle').textContent = `${events.length} events · updated ${dateStr}`;
  } catch (e) {
    document.getElementById('subtitle').textContent = 'Failed to load events';
    document.getElementById('tickerList').innerHTML = '<li style="color:#c00">Error loading data</li>';
  }
}

function renderTickers(tickers) {
  const list = document.getElementById('tickerList');
  list.innerHTML = tickers.map(([sym, market]) =>
    `<li><span>${sym}</span> <span class="market-tag">${market}</span></li>`
  ).join('');
}

function renderCalendar(events) {
  if (calendar) calendar.destroy();

  const fcEvents = events.map(e => ({
    id: e.ticker + '-' + e.type + '-' + e.date + '-' + Math.random().toString(36).slice(2,6),
    title: e.ticker,
    start: e.date,
    allDay: true,
    className: e.type,
    extendedProps: { type: e.type, market: e.market, details: e.details, rawTitle: e.title }
  }));

  calendar = new FullCalendar.Calendar(document.getElementById('calendar'), {
    initialView: 'dayGridMonth',
    height: 'auto',
    events: fcEvents,
    eventClick: function(info) {
      const p = info.event.extendedProps;
      const det = p.details || {};
      const lines = [p.rawTitle || info.event.title, 'Market: ' + (p.market || '-')];
      for (const [k, v] of Object.entries(det)) {
        if (v && v !== 'nan' && v !== '') {
          lines.push(k.replace(/_/g, ' ') + ': ' + v);
        }
      }
      alert(lines.join('\n'));
    },
    eventDidMount: function(info) {
      const type = info.event.extendedProps.type;
      info.el.style.background =
        type === 'earnings' ? '#2563eb' :
        type === 'dividend' ? '#16a34a' :
        type === 'split' ? '#ea580c' : '#9333ea';
      info.el.style.borderColor = 'transparent';
    }
  });
  calendar.render();

  document.getElementById('statusBar').textContent =
    `Showing ${fcEvents.length} events on calendar`;
}

load();
</script>
</body>
</html>
